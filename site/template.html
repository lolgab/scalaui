<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%237a5cff'/%3E%3Cpath d='M20 40 L32 16 L44 40 M25 33 H39' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body class="{{bodyclass}}" data-root="{{root}}">
<header class="topbar">
  <button class="icon-btn menu-btn" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
  <a class="brand" href="{{root}}index.html"><span class="logo" aria-hidden="true"></span>scalaui</a>
  <div class="search">
    <input id="q" type="search" placeholder="Search docs  ( / )" autocomplete="off" aria-label="Search documentation">
    <div id="results" class="results" hidden></div>
  </div>
  <a class="gh" href="https://github.com/lolgab/scalaui">GitHub</a>
  <button class="icon-btn theme-btn" aria-label="Toggle dark and light theme" title="Toggle theme">&#9680;</button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar"><nav aria-label="Documentation">
{{nav}}
  </nav></aside>
  <main class="main">
    <article class="content">
{{content}}
{{prevnext}}
    </article>
    <aside class="toc" aria-label="On this page"><div class="toc-title">On this page</div>{{toc}}</aside>
  </main>
</div>
<script src="{{root}}assets/search-index.js"></script>
<script src="{{root}}assets/app.js"></script>
</body>
</html>
